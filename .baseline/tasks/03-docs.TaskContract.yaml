# Task contract template for the 03-docs landing. See 01-product's header.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The live deployment is recorded from verified facts as agent-readable state in the site's repo
  affects:
    - ai/context/deployment.md
    - ai/context/operations.md
    - README.md
