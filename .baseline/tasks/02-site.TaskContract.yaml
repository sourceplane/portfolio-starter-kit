# Task contract template for the 02-site landing. See 01-scaffold's header.
#
# `affects` names COMPONENTS, by metadata.name: the phase's retouch hook reads
# this list to decide which component.yaml files get the redeploy marker, so
# the deploy set and the task plane's statement of the work are one list.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The site is built by OpenNext and live on stage and prod, its tests green
  affects:
    - web
    - web-tests
  doneWhen:
    - main convergence green (build, tests, deploy and smoke on stage and prod)
    - the home page answers on both workers.dev URLs
  gates: []
