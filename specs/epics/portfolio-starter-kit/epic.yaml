# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (PK → PK-1, PK-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: portfolio-starter-kit
  key: PK
spec:
  title: "Vercel's Portfolio Blog Starter on Cloudflare Workers"
  summary: "The Vercel Portfolio Blog Starter — MDX posts rendered with next-mdx-remote, syntax highlighting, an RSS feed, a sitemap and robots, JSON-LD, dynamic Open Graph images from next/og, Geist fonts and Tailwind 4 — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare inside the Cirrus baseline's repository conventions. It is the content-site port that carries the shapes the blog-starter port left out: a route handler that renders images at request time, a feed, and absolute links that must know the site's origin."
  state: started
  milestones:
    - name: "PK0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [PK-1]
    - name: "PK1 — the portfolio on Workers"
      exitCriteria:
        - "apps/web is the upstream template, built by `next build` + `opennextjs-cloudflare build`"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves /, /blog, every post, /rss, /sitemap.xml, /robots.txt and renders /og?title= as a PNG"
      tasks: [PK-2]
    - name: "PK2 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it, and how the site origin and analytics are configured"
        - "the as-built status records every departure from the upstream template"
      tasks: [PK-3]
    - name: "PK3 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new site from nothing to live on stage and prod in three phases"
        - "a site built from it carries the site only, renamed throughout to its own name, repository and Worker"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [PK-4]
    - name: "PK4 — proven live"
      exitCriteria:
        - "a site bootstrapped from the registered tag is live on stage and prod, its deployment record on main"
        - "what the first live bootstrap found is fixed, and the tests that missed it now reproduce it"
      tasks: [PK-5]
    - name: "PK5 — one landing"
      exitCriteria:
        - "repo-blueprint.yaml builds the site in one landing (`01-product`) and records it in a second (`03-docs`); the card's programme names the same two"
        - "a bootstrap landing is checked by `plan` alone: ci.yml skips the lanes and checks.yml its job on `orun/BASE-…` branches"
        - "Baseline CI is green, and a site bootstrapped from the next tag is live faster than baseline-v2's measured 8m43s"
      tasks: [PK-6]
