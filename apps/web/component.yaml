apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The portfolio and blog (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: portfolio-starter-kit-web-{dev,stage,prod}.
    workerName: portfolio-starter-kit-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # The site's public origin (sitemap, RSS, OG and JSON-LD links are
    # absolute): the environment's SITE_URL when intent.yaml sets one (a custom
    # domain), else its workers.dev URL. The subdomain is written out rather
    # than read from ${WORKERS_DEV_SUBDOMAIN}: the composition exports that to
    # the smoke step only, so the build saw it empty and baked
    # `https://<worker>-<env>..workers.dev` into every absolute link.
    # ${ORUN_ENVIRONMENT} the runner sets for every step.
    buildCommand: NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://portfolio-starter-kit-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders the site (the nav's blog link — not the
    # site's name, which is the owner's to change and HTML-escaped when it
    # carries an `&` or `'`), and the feed is served as XML. Each response is
    # buffered before grep so an early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'href=\"/blog\"' && rss=$(curl -sfL \"${DEPLOYED_URL}/rss\") && echo \"${rss}\" | grep -q '<rss'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
